name: rust-ci

on:
  pull_request: {}
  workflow_dispatch:

jobs:
  rust-ci:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: codex-rs
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: dtolnay/rust-toolchain@a0b273b48ed29de4470960879e8381ff45632f26
        with:
          components: rustfmt
      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: cargo-shear
          version: 1.5.1
      - name: cargo fmt
        run: cargo fmt -- --config imports_granularity=Item --check
      - name: cargo shear
        run: cargo shear
      - name: argument comment lint
        working-directory: .
        run: just argument-comment-lint
