name: Fork release CI

on:
  push:
    branches:
      - releases/rust-v*
  workflow_dispatch:

concurrency:
  group: fork-release-ci::${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cargo-release:
    name: Cargo release branch checks
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: codex-rs
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install Linux sandbox build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends pkg-config libcap-dev

      - uses: dtolnay/rust-toolchain@a0b273b48ed29de4470960879e8381ff45632f26 # 1.93.0
        with:
          components: rustfmt

      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: cargo fmt
        run: cargo fmt -- --config imports_granularity=Item --check

      - name: Build codex CLI
        run: cargo build -p codex-cli

      - name: Test app-server protocol
        run: cargo test -p codex-app-server-protocol

      - name: Test app-server
        run: cargo test -p codex-app-server

      - name: Show sccache stats
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          sccache --show-stats || true
